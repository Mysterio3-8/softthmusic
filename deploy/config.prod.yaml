vk:
  # TG Music | Музыка в телеграм (club240295467) — соответствует VK_GROUP_TOKEN
  group_id: 240295467
  # Общий на весь сервер пул личных (user) токенов для загрузки видео. Здесь только
  # ИМЕНА переменных — значения берутся из своего .env либо из общего /etc/vk-tokens.env.
  # Счётчики загрузок общие с Новостями, Кино и Минусами (SPEC_TOKEN_BALANCER.md):
  # следующая загрузка всегда уходит наименее нагруженному сегодня аккаунту.
  # Пустой список → работаем по-старому, одним VK_USER_TOKEN.
  upload_token_envs:
    - "VK_UPLOAD_TOKEN_1"
  # Потолок загрузок на ОДИН аккаунт в сутки (общий для всех софтов — держать
  # одинаковым везде, иначе софты перестанут использовать аккаунт в разный момент).
  token_daily_cap: 40
  # Минимальный зазор между двумя загрузками ОДНОГО аккаунта. Это и есть главная
  # защита: бан 2026-07-02 прилетел за 12 публикаций ЗА СЕКУНДУ, а не за объём.
  token_min_gap_minutes: 10

youtube:
  # Источники-плейлисты YouTube Music (по порядку: кончились треки на первом — берём второй).
  channels:
    - https://music.youtube.com/playlist?list=PLiwIS076MdajnMNVVhPPbCX9b7N-ZfCQD
    - https://music.youtube.com/playlist?list=PLxZRBJxHKj7Dxj0MLjEbwZXkrYstBYcSe
    - https://music.youtube.com/playlist?list=PL2UxLBJwrOokvRAHhyE9dSPtT7QX4fJK6
    - https://music.youtube.com/playlist?list=PL0QFwxFJGzHKIMRsLmcF_burLpMD0BXoS
    - https://music.youtube.com/playlist?list=PLiQHvJTHMQQtVo0Pp0MoDy33O_sAvCB8e
  max_height: 480

publishing:
  # 3 видео в день, но по ОДНОМУ за запуск (не пачкой) — джоб запускается 3 раза
  # в день (systemd-таймер в 08:45/14:45/20:45 МСК), каждый раз берёт 1 ролик и
  # ставит в отложку на ближайший слот (09:00/15:00/21:00). Так видео попадают
  # в каталог группы по одному.
  posts_per_day: 3
  posts_per_run: 1
  times:
    - "09:00"
    - "15:00"
    - "21:00"

soundcloud:
  # Случайный интервал между постами трека — не «строго каждые N часов».
  # ТЗ 2026-08-03: 12 постов в сутки. 1440 мин / 12 = 120 мин — потолок среднего
  # интервала. 95–140 даёт среднее ~118 и ~12.2 поста, то есть ограничителем
  # работает max_posts_per_day, а интервал отвечает за разброс.
  # 1440 мин / 2 трека = 720 — потолок среднего интервала. 420–660 даёт среднее 540:
  # треки расходятся по всем суткам, а ограничителем работает max_posts_per_day.
  min_interval_minutes: 420
  max_interval_minutes: 660
  # Ночная пауза выключена (start == end): владелец разрешил постить круглосуточно.
  # Вернуть — поставить 23 и 9.
  quiet_start_hour: 0
  quiet_end_hour: 0
  # ТЗ владельца 2026-08-11: «надо 2 трека и 2 сборника» (было 3 трека).
  # Счётчик считает ТОЛЬКО альбомы и треки: у сборников с YouTube свой лимит
  # (youtube_playlists.max_posts_per_day), иначе потоки съедали бы квоту друг друга.
  max_posts_per_day: 2
  # Трек, упавший столько раз подряд, помечается ошибкой и не тормозит очередь.
  max_track_attempts: 3
  work_dir: downloads/soundcloud

  # Автопоиск популярных треков (ТЗ 2026-08-10: «брать популярные и желательно русские
  # треки с ск», жалоба 2026-08-11: «почему только сборники публикуются»).
  # Кончились ссылки владельца — софт идёт искать сам, поэтому очередь больше не пустеет.
  discovery:
    enabled: true
    # Произвольный текст = поиск по SoundCloud (`scsearch`), ссылка берётся как есть.
    # ⚠️ Официальные чарты SoundCloud (`/discover/sets/charts-top:all-music:ru`) сюда
    # ставить бесполезно: yt-dlp этой версии отдаёт на них 404 (проверено 2026-08-11).
    sources:
      - "русский рэп"
      - "русские хиты"
      - "русская музыка новинки"
      - "русский поп хиты"
      - "лучшие треки на русском"
      - "русский реп новинки"
      - "популярная музыка"
    # Ниже min_queue ожидающих треков — запускается добор до target_queue.
    min_queue: 3
    target_queue: 10
    limit_per_source: 40
    # Порог популярности: выдача SoundCloud идёт по релевантности, и рядом с хитом на
    # 12 млн прослушиваний стоит любительская загрузка на 748 (замер 2026-08-11).
    min_plays: 100000

  # Оформление поста:
  #   🎧 Big Baby Tape — ARGUMENTS & FACTS (Album) | Без цензуры
  #
  #   00:00 1. FAX
  #   ...
  #
  #   ♾️ Слушать в Telegram бесплатно и без цензуры: <listen_url>
  #   #big_baby_tape_arguments_facts
  #
  # Этот же текст идёт описанием под видео. Пустой url убирает свою строку.
  post:
    # Страны артиста в метаданных SoundCloud нет — флаг ставится руками.
    flag: "🎧"
    title_suffix: "Без цензуры"
    listen_label: "♾️ Слушать в Telegram бесплатно и без цензуры:"
    listen_url: "https://t.me/tgram_music_bot"
    channel_label: "📢 Канал:"
    channel_url: ""
    # «{artist}_{name}» — свой тег каждому треку и альбому;
    # «{artist}» — один общий на исполнителя.
    hashtag_template: "{artist}_{name}"
    # Короткое имя сообщества VK для «#релиз@группа». Пусто → тег без «@».
    hashtag_group: ""
    track_kind: "Single"
    album_kind: "Album"
    # --- SEO (ТЗ 2026-08-10) ---
    # Постоянные теги сообщества: идут в каждой публикации, склеивают ленту в рубрики.
    base_tags:
      - "музыка"
      - "музыкабезцензуры"
      - "новинкимузыки"
      - "слушатьонлайн"
      - "плейлист"
      - "инфинитимузыка"
      - "infinitymusic"
    # Шаблоны поисковых фраз, {q} — исполнитель, название релиза и их связка.
    # Идут ТОЛЬКО в описание видео: под записью такой список выглядит спамом.
    search_phrases:
      - "{q} слушать онлайн"
      - "{q} скачать бесплатно"
      - "{q} музыка"
      - "{q} новый трек"
    # Постоянные запросы САМОГО сообщества (ТЗ 2026-08-11: «чтобы люди писали музыка
    # без цензуры или инфинити музыка — и мой канал выходил»). Идут в каждом описании
    # ролика независимо от того, разобрался ли исполнитель.
    channel_phrases:
      - "музыка без цензуры"
      - "музыка без цензуры слушать онлайн"
      - "инфинити музыка"
      - "инфинити мьюзик"
      - "infinity music"
      - "скачать музыку бесплатно"
      - "музыка в телеграм"
      - "новинки музыки слушать онлайн"
      - "русская музыка слушать"
      - "плейлист без рекламы"
    post_tag_limit: 6
    video_tag_limit: 16
    # Блок «что это за сервис» в конце описания видео. Он же — та внешняя ссылка на
    # бота, ради которой SEO и затевалось: страницы VK индексируются поисковиками.
    service_block: |
      ━━━━━━━━━━━━━━━━
      ♾️ Infinity Music — вся музыка прямо в Telegram

      🤖 @tgram_music_bot найдёт и пришлёт любой трек за секунды:
      🔎 поиск по названию или строчке из песни
      ⬇️ скачивание в один тап
      🎼 плейлисты, новинки и минусовки

      📲 Открыть бота: https://t.me/tgram_music_bot
      📢 Новинки и подборки: https://t.me/tgramuzuka
      ━━━━━━━━━━━━━━━━

# Сборники-плейлисты с YouTube / YouTube Music (ТЗ 2026-08-10).
# Готовые пользовательские плейлисты скачиваются потреково, каждый трек получает
# подпись «исполнитель — название» на первые 10 секунд, всё склеивается в один ролик.
# Файл сохраняется в ready/ и уходит владельцу (в Telegram, если влезает в 50 МБ),
# чтобы залить его на YouTube руками; в VK сборник публикуется автоматически.
youtube_playlists:
  enabled: true
  # Ссылка на плейлист — берётся как есть. Произвольный текст — поисковый запрос
  # ПО ПЛЕЙЛИСТАМ (обычный поиск YouTube отдал бы одиночные ролики).
  sources:
    - "русский рэп плейлист 2026"
    - "лучшие треки плейлист без рекламы"
    - "популярная музыка сборник 2026"
    - "chill плейлист на русском"
  # Сколько плейлистов забирать из одной выдачи за синхронизацию.
  discover_limit: 20
  # Треков в одном сборнике. Больше не проходит по времени тика: ffmpeg рендерит
  # видео на КАЖДЫЙ трек, на 1-ядерном VPS 15 треков — это уже около часа.
  max_tracks: 15
  # ТЗ: 2 сборника в сутки. Свой счётчик, не общий с треками.
  max_posts_per_day: 2
  # 1440 мин / 2 сборника = 720 мин потолок среднего. 420–620 даёт среднее ~520:
  # сборники расходятся по суткам и не встают рядом с треками.
  min_interval_minutes: 420
  max_interval_minutes: 620
  quiet_start_hour: 0
  quiet_end_hour: 0
  max_attempts: 3
  work_dir: downloads/yt_playlists
  # Готовые файлы для заливки на YouTube. Диск VPS маленький — чистим по сроку.
  ready_dir: ready
  # 2 суток вместо 5 (2026-08-11): сборник весит 120–150 МБ, их два в день — при пяти
  # сутках в ready/ копилось до 1.5 ГБ на диске, где свободно около восьми.
  # Файл всё равно приходит в Telegram сразу, ready/ — это запасной путь через scp.
  ready_keep_days: 2
  # Хост из ~/.ssh/config владельца — подставляется в подсказку «scp ...».
  remote_host: "news-rewriter-vps"
  header: "♾️ Плейлисты от Infinity Music"
  playlist_description: |
    Сборник собран вручную: только целые треки, без обрезок и без рекламы внутри.
    Тайминги ниже — жми на нужное время, чтобы перейти к треку.
  # Заголовок собирается с нуля: название чужого плейлиста не берётся даже частично,
  # чтобы в сообщество не утёк чужой брендинг.
  # ТЗ 2026-08-11: «более кликабельные названия, больше байта, без цензуры можно добавить».
  # {artists} — исполнители ИЗ САМОГО сборника (первые три). Это и байт, и SEO, и
  # уникальность: одинаковый набор артистов дважды подряд почти не встречается, поэтому
  # названия перестают повторяться сами собой. Шаблоны без {artists} — запас на случай,
  # когда исполнителей не разобрали.
  title_templates:
    - "{artists} и другие — музыка без цензуры {year}"
    - "Без цензуры: {artists} и ещё треки, которые залипают"
    - "{artists} — треки, которые ищут все ({year})"
    - "Слушать подряд без рекламы: {artists} и другие"
    - "Эти треки рвут {year}: {artists}"
    - "{artists} и другие — заряд на весь день"
    - "Топ треков {year} без цензуры: {artists}"
    - "{artists} — то, что играет у всех"
    - "Музыка без цензуры и рекламы — {year}"
    - "Треки, которые залипают — сборник {year}"
    - "Хиты {year}, которые ищут все"
    - "Слушать подряд: подборка без рекламы {year}"

ad_block: |
