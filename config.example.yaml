# YouTube -> VK Auto Publisher — конфигурация
#
# Токены ВКонтакте берутся из .env (VK_GROUP_TOKEN + VK_USER_TOKEN), не отсюда.
# Всё остальное настраивается здесь. Файл config.yaml в git не попадает
# (см. .gitignore) — правьте копию, а этот пример держите как шаблон.

vk:
  # ID сообщества (число, без минуса). Пост уйдёт на стену этого сообщества.
  # Должен совпадать с группой, которой принадлежит VK_GROUP_TOKEN.
  group_id: 123456789

youtube:
  # Список каналов-источников. Обрабатываются последовательно сверху вниз:
  # когда на первом кончились неопубликованные ролики — берётся второй и т.д.
  channels:
    - https://www.youtube.com/@example_channel_1/videos
    - https://www.youtube.com/@example_channel_2/videos
  # Максимальная высота кадра для «среднего» качества (меньше = легче файл).
  max_height: 480

publishing:
  # Всего публикаций в день (= сколько раз в день запускается джоб).
  posts_per_day: 3
  # Сколько роликов готовить ЗА ОДИН запуск. 1 = грузить по одному видео за раз
  # (не пачкой), джоб при этом запускается posts_per_day раз в сутки.
  posts_per_run: 1
  # Время отложенных публикаций (по локальному времени процесса). За запуск
  # берётся ближайший будущий слот из этого списка.
  times:
    - "09:00"
    - "15:00"
    - "21:00"

ad_block: |
  ━━━━━━━━━━━━━━━━
  🎧 Вся музыка — прямо в Telegram

  🤖 @tgram_music_bot найдёт и пришлёт любой трек за секунды:
  🔎 поиск по названию или строчке из песни
  ⬇️ скачивание в один тап
  🎼 плейлисты, новинки и минусовки

  📲 Открыть бота: https://t.me/tgram_music_bot
  📢 Новинки и подборки: https://t.me/tgramuzuka
  ━━━━━━━━━━━━━━━━

retry:
  # Задержки повторных попыток при ошибке загрузки в ВК (в минутах).
  # Работают только в режиме --schedule (постоянный процесс).
  # В режиме одного запуска (--once) ролик с ошибкой берётся заново на
  # следующем суточном запуске.
  delays_minutes:
    - 60
    - 180

paths:
  database: data/publisher.db
  downloads: downloads
  logs: logs/publisher.log
