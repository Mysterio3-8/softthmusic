# YouTube -> VK Auto Publisher — конфигурация
#
# Токены ВКонтакте берутся из .env (VK_GROUP_TOKEN + VK_USER_TOKEN), не отсюда.
# Всё остальное настраивается здесь. Файл config.yaml в git не попадает
# (см. .gitignore) — правьте копию, а этот пример держите как шаблон.

vk:
  # ID сообщества (число, без минуса). Пост уйдёт на стену этого сообщества.
  # Должен совпадать с группой, которой принадлежит VK_GROUP_TOKEN.
  group_id: 123456789

youtube:
  # Список каналов-источников. Обрабатываются последовательно сверху вниз:
  # когда на первом кончились неопубликованные ролики — берётся второй и т.д.
  channels:
    - https://www.youtube.com/@example_channel_1/videos
    - https://www.youtube.com/@example_channel_2/videos
  # Максимальная высота кадра для «среднего» качества (меньше = легче файл).
  max_height: 480

publishing:
  # Всего публикаций в день (= сколько раз в день запускается джоб).
  posts_per_day: 3
  # Сколько роликов готовить ЗА ОДИН запуск. 1 = грузить по одному видео за раз
  # (не пачкой), джоб при этом запускается posts_per_day раз в сутки.
  posts_per_run: 1
  # Время отложенных публикаций (по локальному времени процесса). За запуск
  # берётся ближайший будущий слот из этого списка.
  times:
    - "09:00"
    - "15:00"
    - "21:00"

soundcloud:
  # Случайный интервал между постами трека — не «строго каждые N часов».
  # 7 постов в сутки: 1440 мин / 7 = 205 мин — потолок среднего интервала.
  # 160–235 даёт среднее ~198 и ~7.3 поста, то есть ограничителем работает
  # max_posts_per_day, а интервал отвечает за разброс.
  min_interval_minutes: 160
  max_interval_minutes: 235
  # Ночная пауза выключена (start == end): владелец разрешил постить круглосуточно.
  # Вернуть — поставить 23 и 9.
  quiet_start_hour: 0
  quiet_end_hour: 0
  # Суточный лимит. VK разрешает сообществу до 50 записей в сутки, так что 7
  # укладывается; узкое место — user-токен, он дёргается на каждую загрузку видео.
  max_posts_per_day: 7
  # Трек, упавший столько раз подряд, помечается ошибкой и не тормозит очередь.
  max_track_attempts: 3
  work_dir: downloads/soundcloud

  # Оформление поста:
  #   🎧 Big Baby Tape — ARGUMENTS & FACTS (Album) | Без цензуры
  #
  #   00:00 1. FAX
  #   ...
  #
  #   ♾️ Слушать в Telegram бесплатно и без цензуры: <listen_url>
  #   #big_baby_tape_arguments_facts
  #
  # Этот же текст идёт описанием под видео. Пустой url убирает свою строку.
  post:
    # Страны артиста в метаданных SoundCloud нет — флаг ставится руками.
    flag: "🎧"
    title_suffix: "Без цензуры"
    listen_label: "♾️ Слушать в Telegram бесплатно и без цензуры:"
    listen_url: "https://t.me/muz_damn_bot"
    channel_label: "📢 Канал:"
    channel_url: ""
    # «{artist}_{name}» — свой тег каждому треку и альбому;
    # «{artist}» — один общий на исполнителя.
    hashtag_template: "{artist}_{name}"
    # Короткое имя сообщества VK для «#релиз@группа». Пусто → тег без «@».
    hashtag_group: ""
    track_kind: "Single"
    album_kind: "Album"
    # --- SEO (ТЗ 2026-08-10) ---
    # base_tags/search_phrases пустые → прежнее поведение: один тег, без поисковых фраз.
    base_tags:
      - "музыка"
      - "новинкимузыки"
      - "слушатьонлайн"
      - "плейлист"
    search_phrases:
      - "{q} слушать онлайн"
      - "{q} скачать бесплатно"
      - "{q} музыка"
    post_tag_limit: 6
    video_tag_limit: 16
    # Блок про сервис в конце ОПИСАНИЯ ВИДЕО (не записи): внешняя ссылка на бота.
    service_block: |
      ━━━━━━━━━━━━━━━━
      ♾️ Infinity Music — вся музыка прямо в Telegram
      📲 Открыть бота: https://t.me/tgram_music_bot
      ━━━━━━━━━━━━━━━━

# Сборники-плейлисты с YouTube / YouTube Music. Готовые пользовательские плейлисты
# качаются потреково, на первые 10 секунд каждого трека ложится подпись
# «исполнитель — название», всё склеивается в один ролик. Файл остаётся в ready/ и
# уходит владельцу для заливки на YouTube, в VK публикуется автоматически.
youtube_playlists:
  enabled: false          # включить, когда заполните sources
  sources:                # ссылка на плейлист или поисковый запрос по плейлистам
    - "популярная музыка сборник"
  discover_limit: 20
  max_tracks: 15          # ffmpeg рендерит видео на КАЖДЫЙ трек — больше не успеть
  max_posts_per_day: 2    # свой счётчик, не общий с треками
  min_interval_minutes: 420
  max_interval_minutes: 620
  quiet_start_hour: 0
  quiet_end_hour: 0
  max_attempts: 3
  work_dir: downloads/yt_playlists
  ready_dir: ready        # готовые файлы для заливки на YouTube
  ready_keep_days: 5
  remote_host: "news-rewriter-vps"
  # Куда слать готовый сборник. Пусто → TELEGRAM_ADMIN_CHAT_ID; поскольку файл отдаёт
  # ВАША пользовательская сессия, это «Избранное». Хотите в чат с ботом — "@ваш_бот".
  deliver_chat: ""
  header: "♾️ Плейлисты от Infinity Music"
  playlist_description: |
    Сборник собран вручную: только целые треки, без обрезок и без рекламы внутри.
    Тайминги ниже — жми на нужное время, чтобы перейти к треку.
  title_templates:
    - "Плейлист {year}: музыка на каждый день"
    - "Сборник треков {year} — слушать подряд"

ad_block: |
  ━━━━━━━━━━━━━━━━
  🎧 Вся музыка — прямо в Telegram

  🤖 @muz_damn_bot найдёт и пришлёт любой трек за секунды:
  🔎 поиск по названию или строчке из песни
  ⬇️ скачивание в один тап
  🎼 плейлисты, новинки и минусовки

  📲 Открыть бота: https://t.me/muz_damn_bot
  📢 Новинки и подборки: https://t.me/tgramuzuka
  ━━━━━━━━━━━━━━━━

retry:
  # Задержки повторных попыток при ошибке загрузки в ВК (в минутах).
  # Работают только в режиме --schedule (постоянный процесс).
  # В режиме одного запуска (--once) ролик с ошибкой берётся заново на
  # следующем суточном запуске.
  delays_minutes:
    - 60
    - 180

paths:
  database: data/publisher.db
  downloads: downloads
  logs: logs/publisher.log
